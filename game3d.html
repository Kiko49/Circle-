<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Circle</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    /* Картинка игрока сверху */
    #playerIcon {
        position: fixed;
        top: 15px;
        right: 15px;

        width: 180px;
        height: 180px;

        object-fit: contain;
        z-index: 10;

        pointer-events: none;
    }

    /* Кнопки управления */
    #controls {
        position: fixed;
        left: 20px;
        bottom: 25px;

        width: 180px;
        height: 150px;

        z-index: 20;
    }

    .control {
        position: absolute;

        width: 55px;
        height: 55px;

        border: 2px solid white;
        border-radius: 10px;

        background: rgba(0, 0, 0, 0.55);
        color: white;

        font-size: 25px;
        font-weight: bold;

        display: flex;
        justify-content: center;
        align-items: center;

        user-select: none;
        -webkit-user-select: none;
    }

    .control:active {
        background: rgba(255, 255, 255, 0.3);
    }

    #up {
        left: 62px;
        top: 0;
    }

    #down {
        left: 62px;
        bottom: 0;
    }

    #left {
        left: 0;
        top: 62px;
    }

    #right {
        right: 0;
        top: 62px;
    }

    /* Диалог */
    #dialogue {
        position: fixed;

        left: 0;
        bottom: 0;

        width: 100%;
        height: 30%;

        background: rgba(0, 0, 0, 0.9);

        border-top: 3px solid white;

        color: white;

        z-index: 30;

        display: none;

        padding: 20px;
    }

    #speaker {
        font-size: 24px;
        font-weight: bold;

        margin-bottom: 10px;
    }

    #text {
        font-size: 20px;
        line-height: 1.4;

        width: calc(100% - 220px);
    }

    #dialoguePortrait {
        position: absolute;

        right: 25px;
        bottom: 10px;

        width: 180px;
        height: 180px;

        object-fit: contain;
    }

    #dialogueHint {
        position: absolute;

        right: 20px;
        bottom: 10px;

        font-size: 13px;
        opacity: 0.6;
    }
</style>
</head>

<body>

<div id="game"></div>

<!-- Портрет игрока -->
<img id="playerIcon" src="images/player.png">

<!-- Управление -->
<div id="controls">

    <div class="control" id="up">▲</div>
    <div class="control" id="down">▼</div>
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>

</div>

<!-- Диалог -->
<div id="dialogue">

    <div id="speaker">AAA</div>

    <div id="text">
        Эй... ты меня слышишь?
    </div>

    <img id="dialoguePortrait" src="images/character.png">

    <div id="dialogueHint">
        Нажми, чтобы продолжить
    </div>

</div>

<!-- Музыка -->
<audio id="bgMusic" src="music/circllelyy.mp3" loop></audio>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   ОСНОВНЫЕ НАСТРОЙКИ
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   СВЕТ
========================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1
);

scene.add(ambientLight);


/* =========================
   ТЕКСТУРЫ
========================= */

const loader = new THREE.TextureLoader();

const floorTexture =
    loader.load("images/floor.png");

const wallTexture =
    loader.load("images/wall.png");

const characterTexture =
    loader.load("images/character.png");


/* =========================
   ПОЛ
========================= */

const floorGeometry =
    new THREE.PlaneGeometry(16, 16);

const floorMaterial =
    new THREE.MeshBasicMaterial({
        map: floorTexture
    });

const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );

floor.rotation.x = -Math.PI / 2;

floor.position.y = 0;

scene.add(floor);


/* =========================
   СТЕНЫ
========================= */

const wallMaterial =
    new THREE.MeshBasicMaterial({
        map: wallTexture
    });


const wallGeometry =
    new THREE.BoxGeometry(
        16,
        5,
        0.2
    );


/* Задняя стена */

const backWall =
    new THREE.Mesh(
        wallGeometry,
        wallMaterial
    );

backWall.position.set(
    0,
    2.5,
    -8
);

scene.add(backWall);


/* Передняя стена */

const frontWall =
    new THREE.Mesh(
        wallGeometry,
        wallMaterial
    );

frontWall.position.set(
    0,
    2.5,
    8
);

scene.add(frontWall);


/* Боковая стена */

const sideWallGeometry =
    new THREE.BoxGeometry(
        0.2,
        5,
        16
    );


const leftWall =
    new THREE.Mesh(
        sideWallGeometry,
        wallMaterial
    );

leftWall.position.set(
    -8,
    2.5,
    0
);

scene.add(leftWall);


const rightWall =
    new THREE.Mesh(
        sideWallGeometry,
        wallMaterial
    );

rightWall.position.set(
    8,
    2.5,
    0
);

scene.add(rightWall);


/* =========================
   NPC
========================= */

const npcMaterial =
    new THREE.SpriteMaterial({
        map: characterTexture,
        transparent: true
    });

const npc =
    new THREE.Sprite(npcMaterial);

npc.position.set(
    0,
    1.4,
    -3
);

npc.scale.set(
    2.2,
    2.8,
    1
);

scene.add(npc);


/* =========================
   ИГРОК
========================= */

const player = {
    x: 0,
    z: 5,
    speed: 0.08
};


camera.position.set(
    player.x,
    1.6,
    player.z
);


/* =========================
   ДВИЖЕНИЕ
========================= */

const keys = {};


/* Клавиатура */

window.addEventListener(
    "keydown",
    (event) => {

        keys[event.key.toLowerCase()] = true;

    }
);


window.addEventListener(
    "keyup",
    (event) => {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================
   ЭКРАННЫЕ КНОПКИ
========================= */

function buttonControl(
    element,
    key
) {

    const button =
        document.getElementById(element);


    button.addEventListener(
        "touchstart",
        (event) => {

            event.preventDefault();

            keys[key] = true;

        },
        { passive: false }
    );


    button.addEventListener(
        "touchend",
        (event) => {

            event.preventDefault();

            keys[key] = false;

        },
        { passive: false }
    );


    button.addEventListener(
        "mousedown",
        () => {

            keys[key] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        () => {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "mouseleave",
        () => {

            keys[key] = false;

        }
    );
}


/*
    ВАЖНО:

    ▲ = вперёд
    ▼ = назад
*/

buttonControl("up", "w");
buttonControl("down", "s");

buttonControl("left", "a");
buttonControl("right", "d");


/* =========================
   ДИАЛОГ
========================= */

const dialogue =
    document.getElementById("dialogue");

const speaker =
    document.getElementById("speaker");

const text =
    document.getElementById("text");

const dialoguePortrait =
    document.getElementById(
        "dialoguePortrait"
    );


const dialogueLines = [

    {
        speaker: "AAA",
        text: "ААААААА"
    },

    {
        speaker: "AAA",
        text: "Эй... ты меня слышишь?"
    },

    {
        speaker: "AAA",
        text: "Наконец-то ты пришёл."
    }

];


let dialogueIndex = 0;

let inDialogue = false;


/* Показать диалог */

function startDialogue() {

    if (inDialogue) return;

    inDialogue = true;

    dialogueIndex = 0;

    dialogue.style.display = "block";

    showDialogueLine();

}


/* Следующая реплика */

function showDialogueLine() {

    const line =
        dialogueLines[dialogueIndex];


    speaker.textContent =
        line.speaker;

    text.textContent =
        line.text;

}


/* Нажатие на диалог */

dialogue.addEventListener(
    "click",
    () => {

        dialogueIndex++;


        if (
            dialogueIndex >=
            dialogueLines.length
        ) {

            dialogue.style.display =
                "none";

            inDialogue = false;

            dialogueIndex = 0;

            return;
        }


        showDialogueLine();

    }
);


/* =========================
   ПРОВЕРКА NPC
========================= */

function checkNPC() {

    const dx =
        player.x - npc.position.x;

    const dz =
        player.z - npc.position.z;

    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if (
        distance < 2.5 &&
        !inDialogue
    ) {

        startDialogue();

    }

}


/* =========================
   МУЗЫКА
========================= */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );


bgMusic.volume = 0.5;


function startMusic() {

    bgMusic
        .play()
        .catch(() => {});

}


/*
   Телефоны блокируют
   автоматический запуск музыки,
   поэтому запускаем её
   после первого касания.
*/

document.addEventListener(
    "touchstart",
    startMusic,
    { once: true }
);


document.addEventListener(
    "click",
    startMusic,
    { once: true }
);


/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (!inDialogue) {

        /*
           ВПЕРЁД
        */

        if (
            keys["w"] ||
            keys["arrowup"]
        ) {

            player.z -=
                player.speed;

        }


        /*
           НАЗАД
        */

        if (
            keys["s"] ||
            keys["arrowdown"]
        ) {

            player.z +=
                player.speed;

        }


        /*
           ВЛЕВО
        */

        if (
            keys["a"] ||
            keys["arrowleft"]
        ) {

            player.x -=
                player.speed;

        }


        /*
           ВПРАВО
        */

        if (
            keys["d"] ||
            keys["arrowright"]
        ) {

            player.x +=
                player.speed;

        }


        /* Границы комнаты */

        player.x =
            Math.max(
                -7.5,
                Math.min(
                    7.5,
                    player.x
                )
            );


        player.z =
            Math.max(
                -7.5,
                Math.min(
                    7.5,
                    player.z
                )
            );


        camera.position.x =
            player.x;

        camera.position.z =
            player.z;


        checkNPC();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================
   ИЗМЕНЕНИЕ РАЗМЕРА ОКНА
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
