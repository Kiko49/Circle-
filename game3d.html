<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Circle</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   PLAYER EMOTION ICON
========================= */

#playerIcon {
    position: fixed;
    top: 0;
    right: 0;

    width: 180px;
    height: 180px;

    object-fit: contain;

    z-index: 10;
    pointer-events: none;
}

/* =========================
   MOVEMENT BUTTONS
========================= */

#controls {
    position: fixed;

    left: 20px;
    bottom: 25px;

    width: 180px;
    height: 150px;

    z-index: 40;
}

.control {
    position: absolute;

    width: 55px;
    height: 55px;

    border: 2px solid white;
    border-radius: 10px;

    background: rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 25px;
    font-weight: bold;

    display: flex;
    justify-content: center;
    align-items: center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}

.control:active {
    background: rgba(255, 255, 255, 0.3);
}

#up {
    left: 62px;
    top: 0;
}

#down {
    left: 62px;
    bottom: 0;
}

#left {
    left: 0;
    top: 62px;
}

#right {
    right: 0;
    top: 62px;
}

/* =========================
   INTERACTION HINT
========================= */

#interactHint {
    position: fixed;

    left: 50%;
    bottom: 32%;

    transform: translateX(-50%);

    padding: 10px 18px;

    background: rgba(0, 0, 0, 0.75);

    border: 2px solid white;
    border-radius: 8px;

    color: white;

    font-size: 17px;

    z-index: 35;

    display: none;

    text-align: center;

    white-space: nowrap;
}

/* =========================
   DIALOGUE
========================= */

#dialogue {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 30%;

    background: rgba(0, 0, 0, 0.9);

    border-top: 3px solid white;

    color: white;

    z-index: 50;

    display: none;

    padding: 20px;

    cursor: pointer;

    touch-action: manipulation;
}

#speaker {
    font-size: 24px;
    font-weight: bold;

    margin-bottom: 10px;
}

#text {
    font-size: 20px;
    line-height: 1.4;

    width: calc(100% - 220px);
}

#dialoguePortrait {
    position: absolute;

    right: 25px;
    bottom: 10px;

    width: 180px;
    height: 180px;

    object-fit: contain;
}

#dialogueHint {
    position: absolute;

    right: 20px;
    bottom: 10px;

    font-size: 13px;

    opacity: 0.6;
}
</style>
</head>

<body>

<!-- =========================
     3D GAME
========================= -->

<div id="game"></div>


<!-- =========================
     PLAYER ICON
========================= -->

<img
    id="playerIcon"
    src="images/player.png"
    alt="Player"
>


<!-- =========================
     NPC INTERACTION HINT
========================= -->

<div id="interactHint">
    Click the character to talk
</div>


<!-- =========================
     MOVEMENT CONTROLS
========================= -->

<div id="controls">

    <div class="control" id="up">
        ▲
    </div>

    <div class="control" id="down">
        ▼
    </div>

    <div class="control" id="left">
        ◀
    </div>

    <div class="control" id="right">
        ▶
    </div>

</div>


<!-- =========================
     DIALOGUE BOX
========================= -->

<div id="dialogue">

    <div id="speaker">
        AAA
    </div>

    <div id="text">
        AAAAAAA
    </div>

    <img
        id="dialoguePortrait"
        src="images/character.png"
        alt="Character"
    >

    <div id="dialogueHint">
        Click to continue
    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="bgMusic"
    src="music/circllelyy.mp3"
    loop
    preload="auto"
></audio>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    1.6,
    5
);

camera.rotation.order = "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);


/* =========================================================
   TEXTURES
========================================================= */

const loader = new THREE.TextureLoader();

const floorTexture =
    loader.load("images/floor.png");

const wallTexture =
    loader.load("images/wall.png");

const characterTexture =
    loader.load("images/character.png");


/* =========================================================
   FLOOR
========================================================= */

const floor = new THREE.Mesh(

    new THREE.PlaneGeometry(
        16,
        16
    ),

    new THREE.MeshBasicMaterial({
        map: floorTexture
    })

);

floor.rotation.x = -Math.PI / 2;

floor.position.y = 0;

scene.add(floor);


/* =========================================================
   WALLS
========================================================= */

const wallMaterial =
    new THREE.MeshBasicMaterial({
        map: wallTexture
    });


/* BACK WALL */

const wallGeometry =
    new THREE.BoxGeometry(
        16,
        5,
        0.2
    );

const backWall =
    new THREE.Mesh(
        wallGeometry,
        wallMaterial
    );

backWall.position.set(
    0,
    2.5,
    -8
);

scene.add(backWall);


/* FRONT WALL */

const frontWall =
    new THREE.Mesh(
        wallGeometry,
        wallMaterial
    );

frontWall.position.set(
    0,
    2.5,
    8
);

scene.add(frontWall);


/* SIDE WALLS */

const sideWallGeometry =
    new THREE.BoxGeometry(
        0.2,
        5,
        16
    );


const leftWall =
    new THREE.Mesh(
        sideWallGeometry,
        wallMaterial
    );

leftWall.position.set(
    -8,
    2.5,
    0
);

scene.add(leftWall);


const rightWall =
    new THREE.Mesh(
        sideWallGeometry,
        wallMaterial
    );

rightWall.position.set(
    8,
    2.5,
    0
);

scene.add(rightWall);


/* =========================================================
   NPC
========================================================= */

const npc =
    new THREE.Sprite(

        new THREE.SpriteMaterial({
            map: characterTexture,
            transparent: true
        })

    );

npc.position.set(
    0,
    1.4,
    -3
);

npc.scale.set(
    2.2,
    2.8,
    1
);

scene.add(npc);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 0,

    z: 5,

    speed: 0.08

};


/* =========================================================
   CAMERA LOOK
========================================================= */

let yaw = 0;

let pitch = 0;

const maxPitch =
    Math.PI / 2.5;

let looking = false;

let lastTouchX = 0;

let lastTouchY = 0;


/* =========================================================
   TOUCH / MOUSE LOOK
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        looking = true;

        lastTouchX =
            event.clientX;

        lastTouchY =
            event.clientY;

        try {

            renderer.domElement
                .setPointerCapture(
                    event.pointerId
                );

        } catch (e) {}

    }
);


renderer.domElement.addEventListener(
    "pointermove",
    event => {

        if (!looking) return;

        const dx =
            event.clientX -
            lastTouchX;

        const dy =
            event.clientY -
            lastTouchY;

        lastTouchX =
            event.clientX;

        lastTouchY =
            event.clientY;


        yaw -= dx * 0.004;

        pitch -= dy * 0.004;


        pitch =
            Math.max(
                -maxPitch,
                Math.min(
                    maxPitch,
                    pitch
                )
            );

    }
);


renderer.domElement.addEventListener(
    "pointerup",
    event => {

        looking = false;

        try {

            renderer.domElement
                .releasePointerCapture(
                    event.pointerId
                );

        } catch (e) {}

    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    () => {

        looking = false;

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOBILE MOVEMENT BUTTONS
========================================================= */

function buttonControl(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            event.stopPropagation();

            keys[key] = true;

        }
    );


    const release =
        event => {

            event.preventDefault();

            event.stopPropagation();

            keys[key] = false;

        };


    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );

}


buttonControl(
    "up",
    "w"
);

buttonControl(
    "down",
    "s"
);

buttonControl(
    "left",
    "a"
);

buttonControl(
    "right",
    "d"
);


/* =========================================================
   DIALOGUE
========================================================= */

const dialogue =
    document.getElementById(
        "dialogue"
    );

const speaker =
    document.getElementById(
        "speaker"
    );

const text =
    document.getElementById(
        "text"
    );

const interactHint =
    document.getElementById(
        "interactHint"
    );


/* DIALOGUE LINES */

const dialogueLines = [

    {
        speaker: "AAA",
        text: "AAAAAAA"
    },

    {
        speaker: "AAA",
        text: "Hey... can you hear me?"
    },

    {
        speaker: "AAA",
        text: "Finally, you came."
    }

];


let dialogueIndex = 0;

let inDialogue = false;


/*
    After dialogue ends, the player must
    walk away before talking again.
*/

let interactionLocked = false;


/* =========================================================
   START DIALOGUE
========================================================= */

function startDialogue() {

    if (inDialogue) return;

    if (interactionLocked) return;


    inDialogue = true;

    dialogueIndex = 0;


    interactHint.style.display =
        "none";


    dialogue.style.display =
        "block";


    showDialogueLine();

}


/* =========================================================
   SHOW DIALOGUE LINE
========================================================= */

function showDialogueLine() {

    const line =
        dialogueLines[
            dialogueIndex
        ];


    speaker.textContent =
        line.speaker;


    text.textContent =
        line.text;

}


/* =========================================================
   NEXT DIALOGUE
========================================================= */

function nextDialogue() {

    if (!inDialogue) return;


    dialogueIndex++;


    if (
        dialogueIndex >=
        dialogueLines.length
    ) {

        dialogue.style.display =
            "none";


        inDialogue = false;


        dialogueIndex = 0;


        /*
           Prevent immediate reopening.
        */

        interactionLocked = true;


        return;

    }


    showDialogueLine();

}


/* =========================================================
   DIALOGUE CLICK
========================================================= */

dialogue.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        event.stopPropagation();

        nextDialogue();

    }
);


/* =========================================================
   NPC DISTANCE
========================================================= */

function getNPCDistance() {

    const dx =
        player.x -
        npc.position.x;

    const dz =
        player.z -
        npc.position.z;


    return Math.sqrt(
        dx * dx +
        dz * dz
    );

}


/* =========================================================
   NPC INTERACTION
========================================================= */

function updateInteraction() {

    if (inDialogue) {

        interactHint.style.display =
            "none";

        return;

    }


    const distance =
        getNPCDistance();


    /*
       Unlock the NPC after
       walking far enough away.
    */

    if (
        interactionLocked &&
        distance > 3.5
    ) {

        interactionLocked = false;

    }


    /*
       Show the interaction hint.
    */

    if (
        distance < 2.7 &&
        !interactionLocked
    ) {

        interactHint.style.display =
            "block";

    } else {

        interactHint.style.display =
            "none";

    }

}


/* =========================================================
   START DIALOGUE BY CLICKING NEAR NPC
========================================================= */

renderer.domElement.addEventListener(
    "click",
    event => {

        if (inDialogue) return;

        if (interactionLocked) return;


        if (
            getNPCDistance() < 2.7
        ) {

            startDialogue();

        }

    }
);


/* =========================================================
   MUSIC
========================================================= */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );


bgMusic.volume = 0.5;


function startMusic() {

    if (!bgMusic.paused) return;


    bgMusic
        .play()
        .catch(
            error => {

                console.log(
                    "Music could not start:",
                    error
                );

            }
        );

}


/*
   Browsers usually require
   user interaction before
   playing audio.
*/

document.addEventListener(
    "pointerdown",
    startMusic
);

document.addEventListener(
    "touchstart",
    startMusic
);

document.addEventListener(
    "click",
    startMusic
);


/* =========================================================
   CAMERA UPDATE
========================================================= */

function updateCamera() {

    camera.position.x =
        player.x;

    camera.position.y =
        1.6;

    camera.position.z =
        player.z;


    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement() {

    /*
       Player cannot move during dialogue.
    */

    if (inDialogue) return;


    let forward = 0;

    let right = 0;


    /* FORWARD / BACK */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        forward += 1;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        forward -= 1;

    }


    /* LEFT / RIGHT */

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        right -= 1;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        right += 1;

    }


    /*
       Movement follows the
       direction of the camera.
    */

    const forwardX =
        -Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    const rightX =
        Math.cos(yaw);

    const rightZ =
        -Math.sin(yaw);


    player.x += (

        forwardX * forward +
        rightX * right

    ) * player.speed;


    player.z += (

        forwardZ * forward +
        rightZ * right

    ) * player.speed;


    /*
       Current room boundaries.
    */

    player.x =
        Math.max(
            -7.5,
            Math.min(
                7.5,
                player.x
            )
        );


    player.z =
        Math.max(
            -7.5,
            Math.min(
                7.5,
                player.z
            )
        );

}


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateMovement();

    updateCamera();

    updateInteraction();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
